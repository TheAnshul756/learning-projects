name: focustube
description: A distraction-free YouTube wrapper — no shorts, no recommendations, only your subscriptions and search.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Sign-In (OAuth2 for YouTube API)
  google_sign_in: ^6.2.1

  # HTTP client for YouTube Data API v3
  http: ^1.2.1

  # YouTube iframe player (works on web + mobile via WebView)
  youtube_player_iframe: ^5.0.0

  # Image caching
  cached_network_image: ^3.3.1

  # State management
  provider: ^6.1.2

  # Date/time formatting
  intl: ^0.19.0

  # For launching external URLs (channel links, etc.)
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
